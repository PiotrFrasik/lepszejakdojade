# City configuration: Warsaw.
# Schema and validation: backend/cities/registry.py. The file name must equal `id`.
# Exposed by the API: id, names, timezone, map, vehicle_types, line_groups, realtime.
# Internal only (never returned by the API): line_group_rules, feeds, ticket_zones, attributions,
# otp.
# Feed URLs and licences were checked against the publishers on the date in each comment.
# A null URL is deliberate; the comment next to it gives the reason.

id: warszawa
names:
  pl: Warszawa
  en: Warsaw
timezone: Europe/Warsaw

map:
  center:
    lat: 52.2297
    lon: 21.0122
  zoom: 11

# Display order.
vehicle_types: [metro, tram, bus, rail]

# Display order.
line_groups:
  - id: day
    names: { pl: Linie dzienne, en: Day lines }
    colour: "#1f6feb"
  - id: express
    names: { pl: Linie przyspieszone i ekspresowe, en: Fast and express lines }
    colour: "#cf222e"
  - id: night
    names: { pl: Linie nocne, en: Night lines }
    colour: "#3d2b7a"
  - id: suburban
    names: { pl: Linie strefowe, en: Suburban zone lines }
    colour: "#2da44e"
  - id: replacement
    names: { pl: Linie zastępcze i okresowe, en: Replacement and temporary lines }
    colour: "#d4a72c"

# Internal: which line goes to which group. Rules are checked in order and the first match
# wins; a line that matches no rule goes to the first group (day). Each rule may give
# `vehicle_types`, `feeds` (gtfs_static ids) and `short_name` (a regular expression that must
# match the whole GTFS route_short_name); omitted criteria match anything.
# Numbering as published by ZTM Warszawa: buses 1xx-3xx normal, 4xx-5xx fast, E-x express
# (peak), 7xx-8xx zone (suburban), L-x local suburban, Nxx night, Z/Z-x replacement,
# C-x cemetery (temporary); trams 1-79 day; metro M1/M2; SKM Sx and other rail suburban.
line_group_rules:
  - group: replacement
    short_name: "Z.*|C-?\\d+"
  - group: night
    short_name: "N\\d+"
  - group: suburban
    vehicle_types: [rail]
  - group: suburban
    feeds: [wkd, rail]
  - group: suburban
    vehicle_types: [bus]
    short_name: "[78]\\d\\d|L-?\\d+"
  - group: express
    vehicle_types: [bus]
    short_name: "[45]\\d\\d|E-?\\d+"

# Warsaw publishes live vehicle positions but no live departures.
realtime:
  departures: false
  vehicles: true

feeds:
  gtfs_static:
    # checked 2026-11-14: community GTFS built from ZTM Warszawa data by mkuran.pl, rebuilt
    # daily. Includes ZTM buses, trams, metro and SKM; does NOT include WKD (see below).
    - id: ztm
      url: https://mkuran.pl/gtfs/warsaw.zip
    # checked 2026-11-14: WKD (Warszawska Kolej Dojazdowa) by mkuran.pl, CC0.
    # The feed published on that date has service only until about 2026-12-12; check that
    # it has been extended before then.
    - id: wkd
      url: https://mkuran.pl/gtfs/wkd.zip
    # checked 2026-11-14: national rail GTFS by mkuran.pl (PKP PLK timetables; KML, PolRegio,
    # PKP Intercity, Koleje Śląskie...), rebuilt daily, ~26 MB, 30-day window. Cut down on
    # import to calls inside `filter.bbox` (the extent of the ZTM and WKD feeds, rounded outwards).
    - id: rail
      url: https://mkuran.pl/gtfs/polish_trains.zip
      # SKM is excluded: it is already in the ztm feed (mkuran warsaw.zip). WKD is not in this feed.
      filter:
        bbox: [20.55, 51.90, 21.50, 52.52]
        exclude_agencies: [SKM]
  gtfs_rt: []
  other:
    # checked 2026-11-14: vehicle positions from the City of Warsaw open data API. Not GTFS-RT.
    # Query parameters (the schema has no place for them, so they are documented here):
    #   resource_id=f2e5503e-927d-4ad3-9500-4ab9e55deb59
    #   type=1 for buses, type=2 for trams
    #   apikey from the environment variable UM_WARSZAWA_API_KEY (never stored here)
    # Auth errors come back as HTTP 200 with {"result": "false", ...}, so the client must
    # check the body, not only the status code. The endpoint exists, but resource_id was not
    # yet confirmed with a real API key; it must be confirmed with a real key in #20.
    - id: um_vehicle_positions
      kind: um_warszawa_api
      url: https://api.um.warszawa.pl/api/action/busestrams_get/

# PLACEHOLDER: real zone boundaries come with the ticket catalogue (#14).
ticket_zones:
  - id: "1"
    names: { pl: Strefa 1, en: Zone 1 }
  - id: "2"
    names: { pl: Strefa 2, en: Zone 2 }

attributions:
  # checked 2026-11-14 (read manually): open terms; free reuse incl. processing, modification
  # and public display in external apps; no mandated attribution text; the reuser is
  # responsible for keeping data current. ZTM also publishes an official GTFS at
  # https://gtfs.ztm.waw.pl/last (switch from mkuran to be decided separately).
  - name: Zarząd Transportu Miejskiego w Warszawie
    url: https://www.ztm.waw.pl/
    licence: ZTM Warszawa timetable data terms of use
    licence_url: https://www.ztm.waw.pl/pliki-do-pobrania/dane-rozkladowe/
  # checked 2026-11-14: reuse requires stating the source, when the data was created and
  # retrieved, and that the data was processed (to be shown on the data sources page, #25).
  - name: Miasto Stołeczne Warszawa – otwarte dane
    url: https://api.um.warszawa.pl/
    licence: Warsaw Open Data terms of reuse
    licence_url: https://api.um.warszawa.pl/index.php?wcag=true&opc=5,1,0,0,
  # checked 2026-11-14: mkuran.pl asks to expose all attributions listed in the feed's
  # attributions.txt, not only this entry.
  - name: Mikołaj Kuranowski – Warsaw GTFS
    url: https://mkuran.pl/gtfs/
    licence: Provided as is; carries ZTM terms; bus shapes ODbL
    licence_url: https://mkuran.pl/gtfs/
  # checked 2026-11-14
  - name: Warszawska Kolej Dojazdowa (GTFS by mkuran.pl)
    url: https://mkuran.pl/gtfs/
    licence: CC0 1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
  # checked 2026-11-14: reuse requires stating the source, when the data was created and
  # retrieved, that it was processed, and informing PKP PLK about the processing.
  - name: PKP Polskie Linie Kolejowe S.A.
    url: https://www.plk-sa.pl/klienci-i-kontrahenci/api-otwarte-dane
    licence: PKP PLK public sector information reuse terms
    licence_url: https://bip.plk-sa.pl/ponowne-wykorzystywanie
  # checked 2026-11-14: mkuran.pl asks to expose all attributions in the feed's attributions.txt
  # (Mikołaj Kuranowski, PKP PLK, Koleje Mazowieckie).
  - name: Mikołaj Kuranowski – Polish Trains GTFS
    url: https://mkuran.pl/gtfs/
    licence: Provided as is; carries PKP PLK and Koleje Mazowieckie terms
    licence_url: https://mkuran.pl/gtfs/
  # checked 2026-11-14: source, creation/retrieval time and processing must be stated.
  - name: Koleje Mazowieckie – KM sp. z o.o.
    url: https://mazowieckie.com.pl/
    licence: Koleje Mazowieckie public sector information reuse terms
    licence_url: https://bip.mazowieckie.com.pl/pl/ponowne-wykorzystywanie-informacji-sektora-publicznego
  # Street and map data (e.g. the OpenTripPlanner street graph).
  - name: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    licence: ODbL 1.0
    licence_url: https://opendatacommons.org/licenses/odbl/1-0/

# OpenTripPlanner graph build. Optional `bbox: [min_lon, min_lat, max_lon, max_lat]` overrides
# the clip area, which by default is derived from the GTFS stops.
otp:
  # checked 2026-11-14: Geofabrik regional extract (Mazowieckie), ODbL (OpenStreetMap
  # attribution already present above).
  osm_url: https://download.geofabrik.de/europe/poland/mazowieckie-latest.osm.pbf
