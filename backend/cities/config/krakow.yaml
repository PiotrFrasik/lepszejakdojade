# City configuration: Kraków.
# Schema and validation: backend/cities/registry.py. The file name must equal `id`.
# Exposed by the API: id, names, timezone, map, vehicle_types, line_groups, realtime.
# Internal only (never returned by the API): feeds, ticket_zones, attributions, otp.
# Feed URLs and licences were checked against the publishers on the date in each comment.
# A null URL is deliberate; the comment next to it gives the reason.

id: krakow
names:
  pl: Kraków
  en: Cracow
timezone: Europe/Warsaw

map:
  center:
    lat: 50.0614
    lon: 19.9383
  zoom: 12

# Display order.
vehicle_types: [tram, bus, rail]

# Display order.
line_groups:
  - id: day
    names: { pl: Linie dzienne, en: Day lines }
    colour: "#1f6feb"
  - id: night
    names: { pl: Linie nocne, en: Night lines }
    colour: "#3d2b7a"
  - id: agglomeration
    names: { pl: Linie aglomeracyjne, en: Agglomeration lines }
    colour: "#2da44e"
  - id: replacement
    names: { pl: Linie zastępcze i okresowe, en: Replacement and temporary lines }
    colour: "#d4a72c"

realtime:
  departures: true
  vehicles: true

feeds:
  # ZTP Kraków publishes separate feeds for trams (T), city buses (A) and Mobilis
  # agglomeration buses (M). All are CC BY 4.0 (stated on https://gtfs.ztp.krakow.pl/).
  gtfs_static:
    # checked 2026-11-14
    - id: ztp_tram
      url: https://gtfs.ztp.krakow.pl/GTFS_KRK_T.zip
    # checked 2026-11-14
    - id: ztp_bus
      url: https://gtfs.ztp.krakow.pl/GTFS_KRK_A.zip
    # checked 2026-11-14: Mobilis agglomeration buses (~33 lines).
    - id: ztp_mobilis_bus
      url: https://gtfs.ztp.krakow.pl/GTFS_KRK_M.zip
    # checked 2026-11-14: national rail GTFS by mkuran.pl (PKP PLK timetables; KML, PolRegio,
    # PKP Intercity, Koleje Śląskie...), rebuilt daily, ~26 MB, 30-day window. Cut down on
    # import to calls inside `filter.bbox` (the extent of the ZTP feeds, rounded outwards).
    - id: rail
      url: https://mkuran.pl/gtfs/polish_trains.zip
      filter:
        bbox: [19.55, 49.88, 20.40, 50.27]
  gtfs_rt:
    # checked 2026-11-14
    - id: ztp_tram_vehicle_positions
      entity: vehicle_positions
      url: https://gtfs.ztp.krakow.pl/VehiclePositions_T.pb
    # checked 2026-11-14
    - id: ztp_tram_trip_updates
      entity: trip_updates
      url: https://gtfs.ztp.krakow.pl/TripUpdates_T.pb
    # checked 2026-11-14
    - id: ztp_tram_service_alerts
      entity: service_alerts
      url: https://gtfs.ztp.krakow.pl/ServiceAlerts_T.pb
    # checked 2026-11-14
    - id: ztp_bus_vehicle_positions
      entity: vehicle_positions
      url: https://gtfs.ztp.krakow.pl/VehiclePositions_A.pb
    # checked 2026-11-14
    - id: ztp_bus_trip_updates
      entity: trip_updates
      url: https://gtfs.ztp.krakow.pl/TripUpdates_A.pb
    # checked 2026-11-14
    - id: ztp_bus_service_alerts
      entity: service_alerts
      url: https://gtfs.ztp.krakow.pl/ServiceAlerts_A.pb
    # checked 2026-11-14
    - id: ztp_mobilis_vehicle_positions
      entity: vehicle_positions
      url: https://gtfs.ztp.krakow.pl/VehiclePositions_M.pb
    # checked 2026-11-14
    - id: ztp_mobilis_trip_updates
      entity: trip_updates
      url: https://gtfs.ztp.krakow.pl/TripUpdates_M.pb
    # checked 2026-11-14
    - id: ztp_mobilis_service_alerts
      entity: service_alerts
      url: https://gtfs.ztp.krakow.pl/ServiceAlerts_M.pb
  other: []

# PLACEHOLDER: real zone boundaries come with the ticket catalogue (#14).
ticket_zones:
  - id: "1"
    names: { pl: Strefa I, en: Zone I }
  - id: "2"
    names: { pl: Strefa II, en: Zone II }
  - id: "3"
    names: { pl: Strefa III, en: Zone III }

attributions:
  # checked 2026-11-14: licence stated on https://gtfs.ztp.krakow.pl/
  - name: Zarząd Transportu Publicznego w Krakowie
    url: https://gtfs.ztp.krakow.pl/
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
  # checked 2026-11-14: reuse requires stating the source, when the data was created and
  # retrieved, that it was processed, and informing PKP PLK about the processing.
  - name: PKP Polskie Linie Kolejowe S.A.
    url: https://www.plk-sa.pl/klienci-i-kontrahenci/api-otwarte-dane
    licence: PKP PLK public sector information reuse terms
    licence_url: https://bip.plk-sa.pl/ponowne-wykorzystywanie
  # checked 2026-11-14: mkuran.pl asks to expose all attributions in the feed's attributions.txt
  # (Mikołaj Kuranowski, PKP PLK, Koleje Mazowieckie).
  - name: Mikołaj Kuranowski – Polish Trains GTFS
    url: https://mkuran.pl/gtfs/
    licence: Provided as is; carries PKP PLK and Koleje Mazowieckie terms
    licence_url: https://mkuran.pl/gtfs/
  # checked 2026-11-14: source, creation/retrieval time and processing must be stated.
  - name: Koleje Mazowieckie – KM sp. z o.o.
    url: https://mazowieckie.com.pl/
    licence: Koleje Mazowieckie public sector information reuse terms
    licence_url: https://bip.mazowieckie.com.pl/pl/ponowne-wykorzystywanie-informacji-sektora-publicznego
  # Street and map data (e.g. the OpenTripPlanner street graph).
  - name: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    licence: ODbL 1.0
    licence_url: https://opendatacommons.org/licenses/odbl/1-0/

# OpenTripPlanner graph build. Optional `bbox: [min_lon, min_lat, max_lon, max_lat]` overrides
# the clip area, which by default is derived from the GTFS stops.
otp:
  # checked 2026-11-14: Geofabrik regional extract (Małopolskie), ODbL (OpenStreetMap
  # attribution already present above).
  osm_url: https://download.geofabrik.de/europe/poland/malopolskie-latest.osm.pbf
