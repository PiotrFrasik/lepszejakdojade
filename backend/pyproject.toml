[tool.pytest.ini_options]
# --ds wins over the DJANGO_SETTINGS_MODULE env var that docker compose sets to dev.
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-ra --strict-markers --ds=config.settings.test"
testpaths = ["."]
norecursedirs = [".*", "staticfiles", "locale", "__pycache__"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "cities", "transit_data", "timetable", "assistant"]
